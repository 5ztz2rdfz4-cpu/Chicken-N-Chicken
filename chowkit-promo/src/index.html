<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Chicken N Chicken Chow Kit</title>
<style>
@font-face{font-family:P;font-weight:600;src:url(../assets/fonts/poppins-latin-600-normal.woff2)}
@font-face{font-family:P;font-weight:700;src:url(../assets/fonts/poppins-latin-700-normal.woff2)}
@font-face{font-family:P;font-weight:800;src:url(../assets/fonts/poppins-latin-800-normal.woff2)}
@font-face{font-family:P;font-weight:900;src:url(../assets/fonts/poppins-latin-900-normal.woff2)}
@font-face{font-family:Hand;font-weight:700;src:url(../assets/fonts/dancing-script-latin-700-normal.woff2)}

*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--cream);font-family:P,sans-serif}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden}
.scene{position:absolute;inset:0;overflow:hidden;visibility:hidden}
.abs{position:absolute;visibility:hidden;will-change:transform,opacity}
.center{left:0;width:1080px;text-align:center}
.bg-cream{background:radial-gradient(120% 70% at 50% 35%,#FFF8EE 0%,var(--cream) 55%,var(--cream2) 100%)}
.bg-maroon{background:radial-gradient(110% 70% at 50% 40%,#8E2636 0%,var(--maroon) 50%,var(--maroon2) 100%)}
.bg-orange{background:radial-gradient(110% 70% at 50% 40%,#F9A13A 0%,var(--orange) 55%,#D9561A 100%)}
.rays{position:absolute;left:-760px;top:-340px;width:2600px;height:2600px;border-radius:50%;
  background:repeating-conic-gradient(rgba(255,255,255,.07) 0 6deg,transparent 6deg 15deg);
  -webkit-mask:radial-gradient(circle,#000 0,#000 30%,transparent 62%);mask:radial-gradient(circle,#000 0,#000 30%,transparent 62%)}
.h{font-weight:900;line-height:1.02;letter-spacing:-1.5px}
.w{display:inline-block;will-change:transform,opacity}
.chip{display:inline-flex;align-items:center;gap:16px;background:#fff;border-radius:60px;padding:16px 34px 16px 22px;
  font-weight:800;font-size:38px;color:var(--maroon);box-shadow:0 14px 34px rgba(90,20,20,.18);letter-spacing:.5px}
.chip .ic{width:52px;height:52px;border-radius:50%;background:var(--orange);display:flex;align-items:center;justify-content:center}
.frame{background:#fff;padding:14px;border-radius:36px;box-shadow:0 28px 60px rgba(60,10,10,.30)}
.frame .in{overflow:hidden;border-radius:24px;position:relative}
.frame img{width:100%;height:100%;object-fit:cover;display:block;will-change:transform}
.card{background:#fff;border-radius:34px;box-shadow:0 22px 50px rgba(90,20,20,.18)}
.dot{position:absolute;border-radius:50%}
</style>
</head>

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, p) => a + (b - a) * p;
const E = {
  out: p => 1 - Math.pow(1 - p, 3),
  in: p => p * p * p,
  io: p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2,
  back: p => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2); },
  bounce: p => { const n = 7.5625, d = 2.75; if (p < 1 / d) return n * p * p; if (p < 2 / d) return n * (p -= 1.5 / d) * p + .75;
                 if (p < 2.5 / d) return n * (p -= 2.25 / d) * p + .9375; return n * (p -= 2.625 / d) * p + .984375; },
};

function setT(el, x, y, s, r, o) {
  el.style.transform = `translate(${x}px,${y}px) rotate(${r}deg) scale(${s})`;
  el.style.opacity = o;
}
// generic enter / exit animation
function show(el, t, tin, tout, o = {}) {
  if (typeof el === 'string') el = $(el);
  const din = o.din ?? .55, dout = o.dout ?? .35;
  if (t < tin || (tout != null && t >= tout + dout)) { el.style.visibility = 'hidden'; return 0; }
  el.style.visibility = 'visible';
  let x = o.x || 0, y = o.y || 0, s = o.s ?? 1, r = o.r || 0, op = 1;
  const pi = P(t, tin, din), po = tout == null ? 0 : P(t, tout, dout);
  const ei = E.out(pi);
  switch (o.in || 'pop') {
    case 'pop':   s *= .3 + .7 * E.back(pi); op *= clamp(pi * 3); break;
    case 'up':    y += 110 * (1 - ei); op *= ei; break;
    case 'down':  y -= 110 * (1 - ei); op *= ei; break;
    case 'left':  x -= 260 * (1 - ei); op *= ei; break;
    case 'right': x += 260 * (1 - ei); op *= ei; break;
    case 'fly':   y += 1300 * (1 - ei); r += 10 * (1 - ei); break;
    case 'drop':  y -= 500 * (1 - E.bounce(pi)); op *= clamp(pi * 5); break;
    case 'fade':  op *= ei; break;
    case 'zoom':  s *= 1.35 - .35 * ei; op *= ei; break;
    case 'stamp': s *= 2.4 - 1.4 * E.out(pi); op *= clamp(pi * 3); r += -8 * (1 - ei); break;
    case 'none':  break;
  }
  if (po > 0) {
    const eo = E.io(po);
    switch (o.out || 'fade') {
      case 'fade':  op *= 1 - po; s *= 1 - .06 * eo; break;
      case 'up':    y -= 140 * eo; op *= 1 - po; break;
      case 'down':  y += 160 * eo; op *= 1 - po; break;
      case 'left':  x -= 1200 * eo; break;
      case 'right': x += 1200 * eo; break;
      case 'pop':   s *= 1 - .9 * eo; op *= 1 - E.in(po); break;
      case 'none':  break;
    }
  }
  if (o.float) { y += Math.sin((t + o.float) * 1.6) * 7; r += Math.sin((t + o.float) * 1.1) * .6; }
  setT(el, x, y, s, r, op);
  return pi;
}
// word-by-word pop for elements built with data-words
function words(el, t, tin, stagger = .14, din = .45) {
  if (typeof el === 'string') el = $(el);
  el.querySelectorAll('.w').forEach((w, i) => {
    const p = P(t, tin + i * stagger, din);
    const s = .2 + .8 * E.back(p);
    w.style.transform = `translateY(${(1 - E.out(p)) * 40}px) scale(${s})`;
    w.style.opacity = clamp(p * 3);
  });
}
function kb(img, t, a, b, s0, s1, dx = 0, dy = 0) {     // Ken Burns
  const p = E.io(P(t, a, b - a));
  img.style.transform = `translate(${dx * p}px,${dy * p}px) scale(${lerp(s0, s1, p)})`;
}
function sceneVis(id, t, a, b, mode, dur = .5) {       // scene window + entrance transition
  const el = $(id);
  if (t < a || t >= b) { el.style.visibility = 'hidden'; return; }
  el.style.visibility = 'visible';
  const p = E.io(P(t, a, dur));
  el.style.clipPath = ''; el.style.transform = ''; el.style.filter = '';
  if (mode && mode.startsWith('circle')) {
    const [cx, cy] = mode.split(':').slice(1).map(Number);
    el.style.clipPath = p < 1 ? `circle(${p * 2300}px at ${cx || 540}px ${cy || 960}px)` : '';
  } else if (mode === 'slide') {
    el.style.transform = p < 1 ? `translateX(${(1 - p) * 1080}px)` : '';
    const bl = Math.sin(p * Math.PI) * 10; if (bl > .3) el.style.filter = `blur(${bl}px)`;
  } else if (mode === 'up') {
    el.style.transform = p < 1 ? `translateY(${(1 - p) * 1920}px)` : '';
  }
}
function slideOut(id, t, a, dur = .5) {                 // previous scene leaving during whip
  const el = $(id); const p = E.io(P(t, a, dur));
  if (t >= a && p < 1) { el.style.transform = `translateX(${-p * 1080}px)`; const bl = Math.sin(p * Math.PI) * 10; el.style.filter = bl > .3 ? `blur(${bl}px)` : ''; }
}
